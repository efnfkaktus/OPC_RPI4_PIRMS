<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <title>Dynamický PLC Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        #tagSelector {
            min-height: 100px;
        }

        /* Aby bylo vidět více tagů v seznamu */
    </style>
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Multi-Tag Monitor</h5>
                <small>Pro výběr více hodnot drž Ctrl</small>
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-12">
                        <label class="form-label font-weight-bold">Dostupné tagy v databázi:</label>
                        <select id="tagSelector" class="form-select" multiple>
                        </select>
                    </div>
                </div>
                <canvas id="plcChart" style="width:100%; height:450px;"></canvas>
            </div>
        </div>
    </div>

    <script>
        let myChart;
        let config = {};

        // Barvy pro různé křivky
        const barvy = ['#ff6384', '#36a2eb', '#4bc0c0', '#ffcd56', '#9966ff', '#c9cbcf'];

        async function inicializuj() {
            const ctx = document.getElementById('plcChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: { labels: [], datasets: [] },
                options: {
                    responsive: true,
                    scales: { y: { beginAtZero: true } },
                    plugins: { legend: { position: 'top' } }
                }
            });

            try {
                // 1. Získání konfigurace
                const configRes = await fetch('/api/config');
                config = await configRes.json();

                // 2. NAČTENÍ UNIKÁTNÍCH TAGŮ Z DB
                await nactiDostupneTagy();

                // 3. Spuštění smyčky aktualizace
                fetchData();
                setInterval(fetchData, 5000);

                // Reakce na změnu výběru
                document.getElementById('tagSelector').addEventListener('change', fetchData);

            } catch (err) {
                console.error("Chyba při startu:", err);
            }
        }

        async function nactiDostupneTagy() {
            // Voláme Supabase s příkazem select(tag_name) a chceme unikátní hodnoty
            // Poznámka: Supabase API nemá přímo "DISTINCT", tak si řekneme o tagy
            const url = `${config.url}/rest/v1/plc_data?select=tag_name`;
            const res = await fetch(url, {
                headers: { 'apikey': config.key, 'Authorization': `Bearer ${config.key}` }
            });
            const data = await res.json();

            // Vytvoříme unikátní seznam v JavaScriptu
            const unikatniTagy = [...new Set(data.map(item => item.tag_name))];
            const selector = document.getElementById('tagSelector');

            selector.innerHTML = ''; // Vyčistit
            unikatniTagy.forEach(tag => {
                const opt = document.createElement('option');
                opt.value = tag;
                opt.innerHTML = tag;
                selector.appendChild(opt);
            });

            // Předvybrat první tag, aby graf nebyl prázdný
            if (selector.options.length > 0) {
                selector.options[0].selected = true;
            }
        }

        async function fetchData() {
            // Získání pole vybraných tagů
            const vybraneVolby = Array.from(document.getElementById('tagSelector').selectedOptions).map(o => o.value);
            if (vybraneVolby.length === 0) return;

            // Sestavení filtru pro více hodnot: tag_name=in.(Tag1,Tag2)
            const tagFiltr = `(${vybraneVolby.join(',')})`;
            const url = `${config.url}/rest/v1/plc_data?tag_name=in.${tagFiltr}&order=received_at.desc&limit=100`;

            try {
                const res = await fetch(url, {
                    headers: { 'apikey': config.key, 'Authorization': `Bearer ${config.key}` }
                });
                const surovatData = await res.json();

                // Seskupení dat podle tagu (aby se nekřížily čáry)
                const skupiny = {};
                vybraneVolby.forEach(tag => skupiny[tag] = []);

                surovatData.forEach(d => {
                    if (skupiny[d.tag_name]) {
                        skupiny[d.tag_name].push({ x: new Date(d.received_at).toLocaleTimeString(), y: d.value });
                    }
                });

                // Příprava datasetů pro Chart.js
                myChart.data.labels = [...new Set(surovatData.map(d => new Date(d.received_at).toLocaleTimeString()))].reverse();

                myChart.data.datasets = vybraneVolby.map((tag, index) => ({
                    label: tag,
                    data: skupiny[tag].reverse().map(pt => pt.y),
                    borderColor: barvy[index % barvy.length],
                    backgroundColor: 'transparent',
                    tension: 0.2
                }));

                myChart.update('none'); // Update bez otravných animací při každém refreshy
            } catch (e) {
                console.error("Chyba dat:", e);
            }
        }

        inicializuj();
    </script>
    <div class="card mt-3 shadow border-danger">
        <div class="card-header bg-danger text-white">Ovládání PLC</div>
        <div class="card-body text-center">
            <h6 id="controlTagName">Vyberte tag v seznamu výše</h6>
            <div class="btn-group" role="group">
                <button type="button" onclick="odeslatPrikaz(true)" class="btn btn-success btn-lg">ZAPNOUT
                    (TRUE)</button>
                <button type="button" onclick="odeslatPrikaz(false)" class="btn btn-danger btn-lg">VYPNOUT
                    (FALSE)</button>
            </div>
            <p id="commandStatus" class="mt-2 text-muted"></p>
        </div>
    </div>

    <script>
        async function odeslatPrikaz(hodnota) {
            // Vezmeme první vybraný tag ze seznamu
            const selector = document.getElementById('tagSelector');
            const vybranyTag = selector.value;
            const status = document.getElementById('commandStatus');

            if (!vybranyTag) {
                alert("Nejdříve vyberte tag v seznamu!");
                return;
            }

            status.innerText = "Odesílám příkaz...";

            try {
                const res = await fetch('/api/write', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tagName: vybranyTag, value: hodnota })
                });

                if (res.ok) {
                    status.innerText = `✅ Úspěšně zapsáno ${hodnota} do ${vybranyTag}`;
                    status.className = "mt-2 text-success";
                } else {
                    throw new Error("Server odmítl zápis");
                }
            } catch (err) {
                status.innerText = "❌ Chyba zápisu: " + err.message;
                status.className = "mt-2 text-danger";
            }
        }
    </script>
</body>

</html>
